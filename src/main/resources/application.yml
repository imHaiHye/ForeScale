server:
  port: 8080

spring:
  application:
    name: viral-guard-backend

viral-guard:
  cooldown:
    # Scale-out 실행 후 추가 알람을 무시하는 시간 (초). EC2 Cold Start 고려 기본 5분.
    duration-seconds: 300

  scale-out:
    # boto3 Scale-out 스크립트 경로 (인프라팀과 협의된 경로)
    script-path: /opt/viralguard/scripts/scale_out.py
    # Python 실행 파일 경로
    python-path: /usr/bin/python3
    # 스크립트 작업 디렉터리
    working-directory: /opt/viralguard/scripts
    # 스크립트 실행 최대 대기 시간 (초)
    timeout-seconds: 30
    # AWS 리전 (환경변수 AWS_DEFAULT_REGION으로 스크립트에 주입됨)
    aws-region: ap-northeast-2
    # true = Mock 시뮬레이션 (로컬 개발용), false = 실제 boto3 실행 (EC2 배포 시)
    mock-mode: true
    # Scale-out 실패 시 Cooldown 해제 여부 (true=재시도 허용)
    unlock-on-failure: true

logging:
  level:
    com.viralguard: DEBUG
    root: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
